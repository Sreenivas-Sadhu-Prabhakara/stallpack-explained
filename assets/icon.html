<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1E2630; }
  body { display: grid; place-items: center; }
  /* 12% safe padding per side — mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- the awning over the arithmetic: the "explained" family variant of stallpack's icon -->
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M4 5h24v5.5a6 6 0 0 1-12 0 6 6 0 0 1-12 0z" fill="#D2601A"/>
    <g stroke-linecap="round">
      <path d="M8 19.5h16" stroke="#F5F3EE" stroke-width="3.2"/>
      <path d="M8 26h16" stroke="#D2601A" stroke-width="3.2"/>
    </g>
  </svg>
</body>
</html>
